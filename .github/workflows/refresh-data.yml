name: Refresh data

# The point of this workflow is that the repository stays current without anyone
# touching it. Every source it uses is public and unauthenticated, so it needs
# NO repository secrets - which is also why it cannot silently fail on an
# expired token.
on:
  schedule:
    - cron: '0 6 5 * *'        # 06:00 UTC on the 5th, after NPCI publishes the prior month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch, validate and transform
        run: python run.py data

      - name: Regenerate analysis and memos
        run: python run.py analyze

      - name: Regenerate source provenance
        run: python docs/build_docs.py

      - name: Commit if anything moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-pipeline/data/processed insights site/src/data docs/sources.md
          if git diff --staged --quiet; then
            echo "No upstream changes this run."
          else
            git commit -m "data: scheduled refresh $(date -u +%Y-%m-%d)"
            git push
          fi
