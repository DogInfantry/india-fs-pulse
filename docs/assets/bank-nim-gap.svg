<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 404" width="960" height="404" role="img" aria-label="Slope chart. The private bank margin proxy runs from 3.75 to 3.52 percent between FY2023 and FY2026, and the public bank proxy from 2.58 to 2.37 percent. The gap between them is 116 basis points at the start and 114 at the end, so it survived the whole cycle.">
<title>Slope chart. The private bank margin proxy runs from 3.75 to 3.52 percent between FY2023 and FY2026, and the public bank proxy from 2.58 to 2.37 percent. The gap between them is 116 basis points at the start and 114 at the end, so it survived the whole cycle.</title>
