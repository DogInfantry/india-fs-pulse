<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 418" width="960" height="418" role="img" aria-label="Bar chart. Merchant payments are 63.9 percent of PhonePe transactions but only 23.0 percent of value, a gap of 40.8 percentage points. Person to person transfers are the mirror image at 30.8 percent of transactions and 71.2 percent of value.">
