<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 476" width="960" height="476" role="img" aria-label="Variable width bar chart for 2026-07. PhonePe occupies 45.9% of national transactions at an average ticket of 1,330 rupees, and Google Pay 32.3% at 1,309 rupees. Both breach the 30 percent cap, which is drawn on the width axis. The tallest column, CRED, has an average ticket of 4,172 rupees but only 0.6% of transactions against 2.0% of value.">
