<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 412" width="960" height="412" role="img" aria-label="Waterfall chart. Quarterly UPI volume on PhonePe grew from 0.14 to 38.7 billion transactions between 2018Q1 and 2026Q2. The merchant leg contributed 24.6 billion of that, or 64% of all growth.">
