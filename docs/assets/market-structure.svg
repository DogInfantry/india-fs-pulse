<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" width="960" height="448" role="img" aria-label="Line chart. In 2026-07 PhonePe holds 45.9 percent and Google Pay 32.3 percent of national UPI volume, both above the 30 percent NPCI cap. About 4.3 billion transactions a month would have to move between apps for the cap to bind.">
<title>Line chart. In 2026-07 PhonePe holds 45.9 percent and Google Pay 32.3 percent of national UPI volume, both above the 30 percent NPCI cap. About 4.3 billion transactions a month would have to move between apps for the cap to bind.</title>
