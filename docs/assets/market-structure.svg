<text x="47" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#A6B0BE" text-anchor="start">Share of national UPI volume, 2023-12 to 2026-07, plotted on elapsed months so the thinning series does not flatter the trend.</text>
