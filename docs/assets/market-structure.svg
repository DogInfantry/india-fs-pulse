<rect x="34" y="46" width="3" height="21" rx="0" fill="#C02734"/>
<text x="47" y="63" font-family="Georgia,'Iowan Old Style','Times New Roman',serif" font-size="20" font-weight="600" fill="#E9EDF2" text-anchor="start">Both leaders sit above a cap that neither is on course to meet</text>
<text x="47" y="85" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#A6B0BE" text-anchor="start">Share of national UPI volume, 2023-12 to 2026-07, plotted on elapsed months so the thinning series does not flatter the trend.</text>
